<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Settings</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    label { display: block; margin-top: 10px; }
    input, select { margin-top: 5px; }
    button { margin-top: 15px; }
    #message { margin-top: 20px; font-weight: bold; }
    .error { color: #c0392b; }
    .disabled { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Update Your Settings</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% else %}
  <form id="settings-form">
    <label>
      Local Time:
      <input type="time" id="local_time" value="{{ prefill_time or '' }}" required>
    </label>

    <label>
      Timezone:
      <select id="timezone">
        {% for tz_value, tz_label in timezones %}
        <option value="{{ tz_value }}" {% if prefill_timezone == tz_value %}selected{% endif %}>{{ tz_label }}</option>
        {% endfor %}
      </select>
    </label>

    <button type="submit">Save</button>
  </form>

  <div id="message"></div>

  <script>
    const form = document.getElementById('settings-form');
    const messageEl = document.getElementById('message');
    const token = {{ token | tojson }};

    function disableForm(text) {
      form.classList.add('disabled');
      messageEl.innerText = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        const res = await fetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            local_time: document.getElementById('local_time').value,
            timezone: document.getElementById('timezone').value,
          })
        });

        if (res.status === 403) {
          disableForm('This settings link has already been used.');
          return;
        }

        if (!res.ok) {
          throw new Error();
        }

        disableForm('Your settings have been saved successfully.');

      } catch {
        messageEl.innerText = 'Error updating settings.';
      }
    });
  </script>
  {% endif %}
</body>
</html>
