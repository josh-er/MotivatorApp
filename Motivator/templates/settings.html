<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Settings</title>
  <style>
    :root {
      --bg: #F6F4ED;
      --text-primary: #000000;
      --text-secondary: #B4B2A9;
      --input-border: #C7C4B9;
      --button-bg: #3B6D11;
      --button-text: #FFFFFF;
      --error-text: #854F0B;
      --error-border: #BA7517;
      --error-bg: #FAEEDA;
      --link-text: #3B6D11;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #26241F;
        --text-primary: #FFFFFF;
        --text-secondary: #B4B2A9;
        --input-border: #C7C4B9;
        --button-bg: #3B6D11;
        --button-text: #FFFFFF;
        --error-text: #FAC775;
        --error-border: #EF9F27;
        --error-bg: #633806;
        --link-text: #97C459;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      font-size: 18px;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text-primary);
    }
    .container { width: 100%; max-width: 420px; }
    .logo {
      display: block;
      height: 60px;
      margin: 0 auto 16px;
    }
    .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .logo-light { display: none; }
      .logo-dark { display: block; }
    }
    h1 { font-size: 1.5rem; text-align: center; color: var(--text-primary); }
    label { display: block; margin-top: 20px; font-size: 1rem; color: var(--text-primary); }
    input, select {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 1rem;
      min-height: 44px;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-primary);
    }
    input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    button {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 1.1rem;
      min-height: 48px;
      border: none;
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--button-text);
      cursor: pointer;
    }
    #message { margin-top: 20px; font-weight: bold; text-align: center; color: var(--text-primary); }
    .error {
      color: var(--error-text);
      text-align: center;
      padding: 12px;
      border: 1px solid var(--error-border);
      background: var(--error-bg);
      border-radius: 6px;
    }
    .disabled { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
  <img class="logo logo-light" src="/static/motivator_logo_light.svg" alt="Motivator logo">
  <img class="logo logo-dark" src="/static/motivator_logo_dark.svg" alt="Motivator logo">
  <h1>Update Your Settings</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% else %}
  <form id="settings-form">
    <label>
      Local Time:
      <input type="time" id="local_time" value="{{ prefill_time or '' }}" required>
    </label>

    <label>
      Timezone:
      <select id="timezone">
        {% for tz_value, tz_label in timezones %}
        <option value="{{ tz_value }}" {% if prefill_timezone == tz_value %}selected{% endif %}>{{ tz_label }}</option>
        {% endfor %}
      </select>
    </label>

    <button type="submit">Save</button>
  </form>

  <div id="message"></div>

  <script>
    const form = document.getElementById('settings-form');
    const messageEl = document.getElementById('message');
    const token = {{ token | tojson }};

    function disableForm(text) {
      form.classList.add('disabled');
      messageEl.innerText = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        const res = await fetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            local_time: document.getElementById('local_time').value,
            timezone: document.getElementById('timezone').value,
          })
        });

        if (res.status === 403) {
          disableForm('This settings link has already been used.');
          return;
        }

        if (!res.ok) {
          throw new Error();
        }

        disableForm('Your settings have been saved successfully.');

      } catch {
        messageEl.innerText = 'Error updating settings.';
      }
    });
  </script>
  {% endif %}
  </div>
</body>
</html>
